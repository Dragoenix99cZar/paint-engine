<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust + WASM Paint Engine</title>
  <style>
    :root {
      --bg-color: #1e1e24;
      --panel-bg: #2b2b36;
      --accent-color: #6366f1;
      --text-color: #f3f4f6;
      --border-color: #3f3f4e;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .toolbar {
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: flex;
      gap: 8px;
      align-items: center;
      border-right: 1px solid var(--border-color);
      padding-right: 12px;
    }

    input[type="file"] { display: none; }

    .input-field {
      width: 60px;
      background-color: #1a1a22;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 13px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #a0a0b0;
    }

    .btn {
      background-color: #3b3b4f;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .btn:hover { background-color: var(--accent-color); }
    .btn-primary:hover { background-color: var(--accent-color); }
    .btn-danger:hover { background-color: var(--danger-color); }

    .btn.active {
      background-color: var(--accent-color);
      border-color: #818cf8;
      box-shadow: 0 0 8px rgba(99, 102, 241, 0.5);
    }

    .tool-panel {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hidden { display: none !important; }

    .workspace {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 20px;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      background-image:
        linear-gradient(45deg, #282830 25%, transparent 25%),
        linear-gradient(-45deg, #282830 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #282830 75%),
        linear-gradient(-45deg, transparent 75%, #282830 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    #viewport { display: block; }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      cursor: default;
    }

    #overlay.active-tool { pointer-events: auto; cursor: crosshair; }
  </style>
</head>
<body>

  <header class="toolbar">
    <div class="toolbar-group">
      <label for="uploader" class="btn btn-primary">Open Image</label>
      <input type="file" id="uploader" accept="image/png, image/jpeg, image/webp">
      <button id="btn-reset-view" class="btn">Reset View</button>
      <button id="btn-reset-original" class="btn btn-danger">Reset Image</button>
    </div>

    <!-- Selection Tool Options -->
    <div class="toolbar-group">
      <button id="btn-toggle-select" class="btn">Box Select</button>
      <button id="btn-toggle-flood" class="btn">Flood Select</button>
      <button id="btn-toggle-color-range" class="btn">Color Range</button>

      <div id="select-panel" class="tool-panel hidden">
        <div class="input-group"><label for="sel-x">X:</label><input type="number" id="sel-x" class="input-field" value="0" min="0"></div>
        <div class="input-group"><label for="sel-y">Y:</label><input type="number" id="sel-y" class="input-field" value="0" min="0"></div>
        <div class="input-group"><label for="sel-w">W:</label><input type="number" id="sel-w" class="input-field" value="0" min="1"></div>
        <div class="input-group"><label for="sel-h">H:</label><input type="number" id="sel-h" class="input-field" value="0" min="1"></div>
      </div>

      <div id="flood-panel" class="tool-panel hidden">
        <div class="input-group">
          <label for="flood-tolerance">Tolerance:</label>
          <input type="range" id="flood-tolerance" min="0" max="100" value="20">
          <span id="tolerance-val">20%</span>
        </div>
      </div>

      <button id="btn-crop-action" class="btn btn-primary">Crop</button>
      <button id="btn-clear-selection" class="btn">Delete Region</button>
      <button id="btn-deselect" class="btn">Deselect</button>
    </div>

    <div class="toolbar-group">
      <button id="btn-rotate" class="btn">Rotate 90°</button>
      <button id="btn-flip-h" class="btn">Flip ↔</button>
      <button id="btn-flip-v" class="btn">Flip ↕</button>
    </div>

    <!-- Export Group -->
    <div class="toolbar-group">
      <button id="btn-export-png" class="btn">PNG</button>
      <button id="btn-export-jpg" class="btn">JPG</button>
      <button id="btn-export-webp" class="btn">WebP</button>
    </div>
  </header>

  <main class="workspace">
    <div class="canvas-container" id="container">
      <canvas id="viewport"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
